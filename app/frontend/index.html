<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>System for the analysis of areas at risk of land subsidence</title>
        <!--Leaflet CSS-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
         <link rel="stylesheet" href="css/style.css">
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    </head>
    <body>
        <div id="navbar">
            <h1>System for the analysis of areas at risk of land subsidence</h1>
            <div id="info">AOI: Central-South Silesia Voivodeship</div>
        </div>
        <div id="map"></div>
        <div id="sidebar">
            <h3>Legend</h3>
            <div id="legend-items">
                <div class="legend-item">
                    <span>AOI bounds</span>
                    <div class="legend-colour" style="border-width: 2px; border-color: #f53924; border-style: dashed;"></div>
                </div>
                <div class="legend-item">
                    <span>Corine Land Cover</span>
                    <div class="legend-colour-clc" style="border:1px solid grey;">
                    </div>
                </div>
                <div class="legend-item">
                    <span>CBDG: subsidence forecast</span>
                    <div class="legend-colour" style="background: #fabc60; border: 2px solid #fabc60;"></div>
                    
                </div>
                <div class="legend-item" id="container">
                    <span>CBDG-Hydro Area of flood risk</span>
                    <div class="legend-colour" style="background: #2b8cbe; border: 2px solid #2b8cbe;"></div>
                    
                </div>
                <div class="legend-item" id="container">
                    <span>Detected subsidence areas var. 1</span>
                    <div class="legend-colour" style="background: #fd44b9; border: 2px solid #fd44b9;"></div>
                    
                </div>
                <div class="legend-item" id="container">
                    <span>Detected subsidence areas var. 2</span>
                    <div class="legend-colour" style="background: #9460f5; border: 2px solid #9460f5;"></div>                  
                </div>
                <div class="legend-item" id="container">
                    <span>EGMS point</span>
                    <div class="legend-item">
                    <i class="fa fa-circle" aria-hidden="true" style="color:#f9729d;"></i>  </div>              
                </div>
                <div class="legend-item">
                    <span>EGMS raster</span>
                    <div>
                    <canvas id="egms_legend" width="70" height="145" style="border:1px solid grey;"></canvas>
                    </div>
                </div>
            </div>
            <h3>Filters</h3>
            <form id="filters">
                <div class="filter-items">
                <div class="filter-item">
                    <label>EGMS velocity range [mm/year]:</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="number" id="filter-velocity-min" placeholder="MIN" value="-90" style="width: 45%;">
                        <input type="number" id="filter-velocity-max" placeholder="MAX" value="30" style="width: 45%;">
                    </div>
                </div>
                <div class="filter-item">
                    <label>CLC: </label>
                    <select id="filter-clc" multiple>
                        <option value="100" selected>All</option>
                    </select>
                </div>
                </div>
                <button id="filters-on" type="submit">Apply filters</button>
                <button id="filters-off" type="reset">Reset</button>
            </form>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
        <script src="https://unpkg.com/georaster"></script>
        <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.min.js"></script>
        <script type="module" src="js/layers.js"></script>
        <script type="module" src="js/map.js"></script>
        <script type="module" src="js/filters.js"></script>
        <script type="module" src="js/raports.js"></script>
        
    </body>
</html>
