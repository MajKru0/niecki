<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>System for the analysis of areas at risk of land subsidence</title>
        <!--Leaflet CSS-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
        <!-- Custom CSS TODO: -->
         <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="navbar">
            <h1>System for the analysis of areas at risk of land subsidence</h1>
            <div id="info">AOI: Central-South Silesia Voivodeship</div>
        </div>
        <div id="map"></div>
        <div id="sidebar">
            <h3>Layers</h3>
            <div id="layers-panel">
                <!-- TOCHECK: JS part -->
            </div>
            <h3>Legend</h3>
            <div id="legend-items">
                <div class="legend-item">
                    <span>AOI bounds</span>
                    <div class="legend-colour" style="border-width: 2px; border-color: #f53924; border-style: dashed;"></div>
                </div>
                <div class="legend-item">
                    <foot>27</foot>
                    <canvas id="egms_legend" width="70" height="145" style="border:1px solid grey;"></canvas>

                </div>
                <div class="legend-item">
                    <div class="legend-colour" style="background: #b9f1bb; border: 2px solid #2dac33;"></div>
                    <span>CLC</span>
                </div>
                <div class="legend-item">
                    <div class="legend-colour" style="background: #fabc60; border: 2px solid #f57d28;"></div>
                    <span>CBDG: subsidence forecast</span>
                </div>
                <div class="legend-item" id="container">
                    <div class="legend-colour" style="background: #64e0f6; border: 2px solid #1976D2;"></div>
                    <span>CBDG-Hydro Area of flood risk</span>
                </div>
            </div>
            <h3>Filters</h3>
            <div id="filters">
                <div class="filter-item">
                    <label>EGMS velocity range [mm/year]:</label>
                    <div style="display: flex; gap: 5px;">
                        <!-- TOCHECK: values-->
                        <input type="number" id="filter-velocity-min" placeholder="MIN" value="-90" style="width: 45%;">
                        <input type="number" id="filter-velocity-max" placeholder="MAX" value="30" style="width: 45%;">
                    </div>
                </div>
                <div class="filter-item">
                    <label>CLC: </label>
                    <select id="filter-clc">
                        <option value="">All</option>
                        <option value="1">Forest</option>
                        <option value="2">Water</option>
                        <option value="3">Buildings</option><!-- TODO: add rest from sql - dodaj oddzielną tabelę z pokryciem terenu-->
                    </select>
                </div>
                <button id="filters-on">Apply filters</button>
            </div>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
        <script src="https://unpkg.com/georaster"></script>
        <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.min.js"></script>
        <script type="module" src="js/layers.js"></script>
        <script type="module" src="js/map.js"></script>
        
    </body>
</html>
